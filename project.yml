name: NomadDashboard
options:
  minimumXcodeGenVersion: 2.39.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
packages:
  NomadCore:
    path: Packages/NomadCore
  NomadUI:
    path: Packages/NomadUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
settings:
  base:
    PRODUCT_NAME: Nomad Dashboard
    APP_DISPLAY_NAME: Nomad Dashboard
    PRODUCT_BUNDLE_IDENTIFIER: com.iloapps.NomadDashboard
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SPARKLE_FEED_URL: ""
    SPARKLE_PUBLIC_ED_KEY: ""
    TELEMETRYDECK_APP_ID: "CF490A0E-DC17-41E0-B7B5-04CED6171D48"
targets:
  NomadDashboard:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.travel
        LSUIElement: true
        NomadAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NomadURLScheme: $(NOMAD_URL_SCHEME)
        NomadTeamIdentifier: $(DEVELOPMENT_TEAM)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(NOMAD_URL_SCHEME)
        NSLocationUsageDescription: Nomad Dashboard uses your location for local weather, travel context, and reading the name of your current Wi‑Fi network for Data Guard hotspot metering.
        NSLocationWhenInUseUsageDescription: Nomad Dashboard uses your location for local weather, travel context, and reading the name of your current Wi‑Fi network for Data Guard hotspot metering.
        ReliefWebAppName: $(RELIEFWEB_APPNAME)
        SUEnableAutomaticChecks: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        TelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: App/NomadDashboard.entitlements
    dependencies:
      - package: NomadCore
      - package: NomadUI
      - package: Sparkle
        product: Sparkle
      - target: NomadDashboardWidgets
        embed: true
        codeSign: true
      # The privileged power helper (Keep Awake with the lid closed). SMAppService registers it from here.
      - target: NomadDashboardPowerHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/HelperTools
    # The helper's launchd plist carries the per-configuration label, so it is generated from the build settings.
    postCompileScripts:
      - name: Generate Power Helper launchd plist
        script: |
          /bin/zsh "${SRCROOT}/App/PowerHelper/generate-launchd-plist.sh"
        inputFiles:
          - $(SRCROOT)/App/PowerHelper/generate-launchd-plist.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(NOMAD_POWER_HELPER_LABEL).plist
  NomadDashboardPowerHelper:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/PowerHelper.Debug.xcconfig
      Release: Config/PowerHelper.Release.xcconfig
    sources:
      - App/PowerHelper/Sources
    info:
      path: App/PowerHelper/Info.plist
      properties:
        CFBundleName: Nomad Dashboard Power Helper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NomadClientBundleIdentifier: $(NOMAD_APP_BUNDLE_IDENTIFIER)
        NomadClientTeamIdentifier: $(DEVELOPMENT_TEAM)
    settings:
      base:
        INFOPLIST_FILE: App/PowerHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: NomadCore
        product: NomadPowerHelperKit
  NomadDashboardWidgets:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Widgets.Debug.xcconfig
      Release: Config/Widgets.Release.xcconfig
    sources:
      - App/Widgets/Sources
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nomad Dashboard Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NomadAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NomadURLScheme: $(NOMAD_URL_SCHEME)
    settings:
      base:
        INFOPLIST_FILE: App/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Widgets/NomadDashboardWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: NomadCore
      - package: NomadUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  NomadDashboard:
    build:
      targets:
        NomadDashboard: all
    run:
      config: Debug
    archive:
      config: Release
